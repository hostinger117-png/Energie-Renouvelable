<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form-energie</title>
    <style>
        body{
            background-image:url(../img/logo.jpg);
            background-repeat: no-repeat;
            background-size: 100%;
            height: 100vh;
        }
        form{
            display:flex;
            flex-direction:column;
            width:300px;
            margin:50px auto;
            gap:10px;
            padding:20px;
            border-radius:10px;
            background-color:transparent;
            backdrop-filter:blur(20px);
            box-shadow: 4px 0 20px black;

        }
        input{
            height:50px;
            border-radius:5px;
            outline:none;
            background: transparent;
            border:1px solid #fcf7f7;
            padding:0 10px;
        }
        button{
           height: 50px;
           border-radius:5px; 
           background-color : darkblue;
           color:azure;
           border:none;
           cursor:pointer;
        }
    </style>
</head>
<body>
    <form action="POST">
        <h2 style="text-align:center;">Contactez nous</h2>
        <input type="text" name="name" placeholder="Votre nom"  required>
        <input type="text" name="email" placeholder="Votre Email" required>
        <input type="text" name="password" placeholder="Votre password" required>

        
        <button>Envoyer</button>
        <p>si vouns n'avez pas un compte <a href="#">creat account</a></p>
    </form>
    
    

</body>
</html>
